    id: "restart_device"
    name: "${friendly_name} Restart"
    entity_category: 'diagnostic'
  - platform: safe_mode
    id: "restart_device_safe_mode"
    name: "${friendly_name} Restart (Safe Mode)"
    entity_category: 'diagnostic'
  - platform: ld2410
    factory_reset:
      name: Factory reset
    restart:
      name: Restart
    query_params:
      name: Query params
    background_correction:
      name: Calibrate radar