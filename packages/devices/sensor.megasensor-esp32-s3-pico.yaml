# Device Specific Config
esphome:
  name: ${name}
  comment: ${device_description}
  project:
    name: "${project_name}"
    version: "${project_version}"
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

captive_portal:

web_server:
  port: 80
  # auth:
  #   username: admin
  #   password: !secret web_server_password
  #   type: digest
  include_internal: true
  local: true

