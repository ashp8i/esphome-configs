number:
  - platform: ld2410
    timeout:
      id: ld2410_timeout
      name: "Timeout"
      on_value:
        then:
          - if:
              condition: { lambda: 'return !id(is_syncing_to_radar) && (int)x != id(nvram_timeout);' }
              then:
                - globals.set: { id: nvram_timeout, value: !lambda 'return (int)x;' }
