substitutions:
  name: "lowerloftstairssensor"
  device_ssid: "LLS Motion"
  device_description: "Tuya ZY-M100 Motion Sensor ESP32-C3"
  friendly_name: "Lower Loft Stairs Motion" # Put the name that you want to see in Home Assistant.
  # switch1b1_topic: ashishswitch1/button/1/command
  # switch1b2_topic: ashishswitch1/button/2/command
  presence_binary_sensor_id: lowerloftstairspresence
  light_command_topic_1: lower-loft-stairs/light/lower-loft-stairs/command
  udp_consumer_device_name_1: lower-loft-stairs
  udp_consumer_key_1: !secret udp_key_1
  udp_provider_key_1: !secret udp_key_2
  sensor_icon: "hue:ceiling-aurelle"
  api_key: !secret llsmotion_noise_key
  project_name: "tuya.zy-m100-wifi"
  project_version: "1.0"

packages:
  - !include packages/base/production.yaml
  - !include packages/devices/sensor.zy-m100-esp32-c3.yaml
  - !include packages/common/api.yaml
  - !include packages/common/mqtt.yaml
  - !include packages/common/button.yaml
  - !include packages/common/text-sensor.yaml
  - !include packages/sensor/zy-m100.yaml
  - !include packages/binary-sensor/zy-m100.yaml